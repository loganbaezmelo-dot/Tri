<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tri File Compiler (.tri)</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --accent: #58a6ff;
      --accent-hover: #1f6feb;
      --text: #c9d1d9;
      --text-dim: #8b949e;
      --code-bg: #0b0e14;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 24px;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 2rem;
      color: #fff;
    }

    header p {
      color: var(--text-dim);
      margin-top: 4px;
    }

    .tabs {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .view-panel {
      display: none;
    }

    .view-panel.active {
      display: block;
    }

    .grid-inputs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 16px;
      margin-bottom: 16px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .card-header {
      padding: 10px 14px;
      background: #21262d;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      font-weight: 600;
    }

    textarea {
      width: 100%;
      height: 250px;
      background: var(--code-bg);
      color: #79c0ff;
      border: none;
      padding: 12px;
      font-family: Consolas, monospace;
      font-size: 0.85rem;
      resize: vertical;
      outline: none;
    }

    .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin: 16px 0;
      flex-wrap: wrap;
    }

    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: #21262d;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-secondary:hover {
      background: #30363d;
    }

    iframe {
      width: 100%;
      height: 350px;
      border: none;
      background: #fff;
      border-radius: 0 0 8px 8px;
    }

    .preview-box {
      margin-top: 24px;
    }
  </style>
</head>
<body>

  <header>
    <h1>.tri Compiler ⚡</h1>
    <p>Convert HTML, CSS, JS into .tri files & decompose .tri files back into code</p>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('to-tri')">Bundle to .tri</button>
    <button class="tab-btn" onclick="switchTab('from-tri')">Extract from .tri</button>
  </div>

  <div class="container">
    <!-- VIEW 1: CODE TO .TRI -->
    <div id="to-tri" class="view-panel active">
      <div class="grid-inputs">
        <div class="card">
          <div class="card-header">HTML Markup</div>
          <textarea id="in-html" placeholder="<div>Hello World</div>"></textarea>
        </div>
        <div class="card">
          <div class="card-header">CSS Styles</div>
          <textarea id="in-css" placeholder="body { background: #000; color: #fff; }"></textarea>
        </div>
        <div class="card">
          <div class="card-header">JS Logic</div>
          <textarea id="in-js" placeholder="console.log('Running from .tri!');"></textarea>
        </div>
      </div>

      <div class="actions">
        <button class="btn" onclick="compileToTri()">Compile to .tri ➔</button>
      </div>

      <div class="card">
        <div class="card-header">
          <span>Output: Compiled .tri File</span>
          <div>
            <button class="btn btn-secondary" onclick="copyText('out-tri')">Copy</button>
            <button class="btn btn-secondary" onclick="downloadFile('out-tri', 'bundle.tri')">Download .tri</button>
          </div>
        </div>
        <textarea id="out-tri" readonly placeholder="Your compiled .tri file will appear here..."></textarea>
      </div>
    </div>

    <!-- VIEW 2: .TRI TO CODE -->
    <div id="from-tri" class="view-panel">
      <div class="card" style="margin-bottom: 16px;">
        <div class="card-header">
          <span>Input: .tri Code</span>
          <input type="file" id="tri-upload" accept=".tri,.txt,*" style="display: none;" onchange="handleFileUpload(event)">
          <button class="btn btn-secondary" onclick="document.getElementById('tri-upload').click()">Upload .tri</button>
        </div>
        <textarea id="in-tri" placeholder="Paste your @markup, @style, @logic here..."></textarea>
      </div>

      <div class="actions">
        <button class="btn" onclick="decompileFromTri()">Extract Components ➔</button>
      </div>

      <div class="grid-inputs">
        <div class="card">
          <div class="card-header">
            <span>Extracted HTML</span>
            <button class="btn btn-secondary" onclick="downloadFile('out-html', 'index.html', 'text/html')">Download</button>
          </div>
          <textarea id="out-html" readonly></textarea>
        </div>
        <div class="card">
          <div class="card-header">
            <span>Extracted CSS</span>
            <button class="btn btn-secondary" onclick="downloadFile('out-css', 'style.css', 'text/css')">Download</button>
          </div>
          <textarea id="out-css" readonly></textarea>
        </div>
        <div class="card">
          <div class="card-header">
            <span>Extracted JS</span>
            <button class="btn btn-secondary" onclick="downloadFile('out-js', 'script.js', 'text/javascript')">Download</button>
          </div>
          <textarea id="out-js" readonly></textarea>
        </div>
      </div>

      <!-- Live Runner -->
      <div class="card preview-box">
        <div class="card-header">
          <span>Live Executable Preview</span>
          <button class="btn btn-secondary" onclick="downloadSingleHtml()">Download Full Standalone .html</button>
        </div>
        <iframe id="preview-frame"></iframe>
      </div>
    </div>
  </div>

  <script>
    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
      
      event.target.classList.add('active');
      document.getElementById(tabId).classList.add('active');
    }

    function compileToTri() {
      const html = document.getElementById('in-html').value.trim();
      const css = document.getElementById('in-css').value.trim();
      const js = document.getElementById('in-js').value.trim();

      let triOutput = '';

      if (html) {
        triOutput += `@markup {\n${html}\n}\n\n`;
      }
      if (css) {
        triOutput += `@style {\n${css}\n}\n\n`;
      }
      if (js) {
        triOutput += `@logic {\n${js}\n}\n`;
      }

      document.getElementById('out-tri').value = triOutput.trim();
    }

    function parseTri(content) {
      const markupMatch = content.match(/@markup\s*\{([\s\S]*?)\}(?=(\s*@style|\s*@logic|$))/i);
      const styleMatch  = content.match(/@style\s*\{([\s\S]*?)\}(?=(\s*@markup|\s*@logic|$))/i);
      const logicMatch  = content.match(/@logic\s*\{([\s\S]*?)\}(?=(\s*@markup|\s*@style|$))/i);

      return {
        html: markupMatch ? markupMatch[1].trim() : '',
        css: styleMatch ? styleMatch[1].trim() : '',
        js: logicMatch ? logicMatch[1].trim() : ''
      };
    }

    function decompileFromTri() {
      const triContent = document.getElementById('in-tri').value;
      const { html, css, js } = parseTri(triContent);

      document.getElementById('out-html').value = html;
      document.getElementById('out-css').value = css;
      document.getElementById('out-js').value = js;

      renderPreview(html, css, js);
    }

    function renderPreview(html, css, js) {
      const frame = document.getElementById('preview-frame');
      const doc = frame.contentDocument || frame.contentWindow.document;

      const code = `
        <!DOCTYPE html>
        <html lang="en">
          <head>
            <meta charset="utf-8">
            <style>${css}</style>
          </head>
          <body>
            ${html}
            <script>${js}<\/script>
          </body>
        </html>
      `;

      doc.open();
      doc.write(code);
      doc.close();
    }

    function copyText(elemId) {
      const val = document.getElementById(elemId).value;
      navigator.clipboard.writeText(val);
      alert('Copied to clipboard!');
    }

    function downloadFile(elemId, filename, mimeType = 'application/octet-stream') {
      const content = document.getElementById(elemId).value;
      const blob = new Blob(["\uFEFF" + content], { type: `${mimeType};charset=utf-8` });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function downloadSingleHtml() {
      const html = document.getElementById('out-html').value;
      const css = document.getElementById('out-css').value;
      const js = document.getElementById('out-js').value;

      const fullHtml = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
${css}
  </style>
</head>
<body>
${html}

  <script>
${js}
  <\/script>
</body>
</html>`;

      const blob = new Blob(["\uFEFF" + fullHtml], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'bundle.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function handleFileUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        document.getElementById('in-tri').value = event.target.result;
      };
      reader.readAsText(file, 'UTF-8');
    }
  </script>
</body>
</html>
